#cloud-config # Pre‑MVP provisioning for Raspberry Pi (NVMe boot, Wi‑Fi, security, Docker, Ansible, GPG + SOPS)

package_upgrade: true
packages:
  - ufw          # firewall
  - curl
  - git
  - python3-pip
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose
  - ansible
  - gnupg        # needed for GPG key handling
  - sops         # decrypt secrets
  - systemd-timesyncd

# -----------------------------------------------------------------
# 1. Deliver GPG private key (base64‑encoded) and encrypted secrets (base64‑encoded)
# -----------------------------------------------------------------
write_files:
  - path: /root/gpg_private.key.b64
    encoding: b64
    content: |
      <BASE64_GPG_PRIVATE_KEY> INSERT THE CONTENT OF THE ENCRYPTED SECRETS HERE
    permissions: '0600'
  - path: /root/secrets.enc.yaml.b64
    encoding: b64
    content: |
      <BASE64_ENCRYPTED_SECRETS> INSERT THE CONTENT OF THE ENCRYPTED SECRETS HERE
    permissions: '0600'

# -----------------------------------------------------------------
# 2. Cloud‑init commands – import key, decrypt, clean up, configure system
# -----------------------------------------------------------------
runcmd:
  # Import the one‑time GPG private key
  - |
      base64 -d /root/gpg_private.key.b64 > /root/gpg_private.key &&
      chmod 600 /root/gpg_private.key &&
      gpg --import /root/gpg_private.key &&
      rm -f /root/gpg_private.key

  # Decrypt the encrypted secrets into the application .env file
  - |
      base64 -d /root/secrets.enc.yaml.b64 > /root/secrets.enc.yaml &&
      chmod 600 /root/secrets.enc.yaml &&
      sops -d /root/secrets.enc.yaml > /home/pi/stock-ticker/.env &&
      chmod 600 /home/pi/stock-ticker/.env &&
      rm -f /root/secrets.enc.yaml /root/secrets.enc.yaml.b64

  # Remove the GPG private key from the keyring (clean‑up)
  - |
      GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | cut -d: -f5 | head -n1) &&
      if [ -n "$GPG_KEY_ID" ]; then gpg --delete-secret-keys "$GPG_KEY_ID"; gpg --delete-keys "$GPG_KEY_ID"; fi

  # Enable time sync
  - systemctl enable --now systemd-timesyncd

  # SSH hardening – key‑only access
  - sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
  - systemctl restart sshd

  # Firewall (ufw) – allow SSH and API port 8000 (LAN only); Phase 2 note below
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow from 192.168.0.0/16 to any port 22 comment "LAN SSH"
  - ufw allow from 192.168.0.0/16 to any port 8000 comment "API LAN (pre‑proxy)"
  # 👉 When Phase 2 (reverse‑proxy) is added: replace the line above with
  #    ufw allow 443/tcp   # expose HTTPS for the proxy
  #    ufw deny 8000        # block direct API access
  - ufw --force enable

  # Add pi to docker group and enable Docker daemon
  - usermod -aG docker pi
  - systemctl enable docker

  # Mount existing NVMe partition (UUID‑based, no re‑format)
  - |
      NVME_PART=$(lsblk -nr -o NAME,TYPE | awk '/nvme/ && $2=="part" {print $1}' | head -n1) &&
      if [ -z "$NVME_PART" ]; then echo "No NVMe partition found – skipping mount."; exit 0; fi &&
      FS_TYPE=$(blkid -s TYPE -o value "/dev/$NVME_PART") &&
      if [ "$FS_TYPE" != "ext4" ]; then echo "NVMe not ext4 – skipping mount."; exit 0; fi &&
      mkdir -p /mnt/nvme &&
      PART_UUID=$(blkid -s UUID -o value "/dev/$NVME_PART") &&
      if ! grep -q "UUID=$PART_UUID" /etc/fstab; then echo "UUID=$PART_UUID /mnt/nvme ext4 defaults,noatime,discard 0 2" >> /etc/fstab; fi &&
      mountpoint -q /mnt/nvme || mount /mnt/nvme

  # Weekly TRIM for NVMe
  - echo "fstrim -av" > /etc/cron.weekly/fstrim && chmod +x /etc/cron.weekly/fstrim

  # Create systemd unit to run Ansible playbook after networking
  - |
      cat <<'EOF' > /etc/systemd/system/ansible-provision.service
[Unit]
Description=Run Ansible provisioning for Stock‑Ticker MVP
After=network-online.target
Wants=network-online.target
[Service]
Type=oneshot
User=root
ExecStart=/usr/bin/ansible-playbook -i localhost, /home/pi/stock-ticker/ansible/provision.yml
EOF
      systemctl daemon-reload
      systemctl enable ansible-provision.service

final_message: |
  ------------------------------------------------------------
  Raspberry Pi pre‑MVP setup complete.
   • SSH hardened (key‑only)
   • UFW firewall active (SSH + 8000)
   • Docker installed and enabled
   • NVMe mounted at /mnt/nvme
   • Secrets decrypted via GPG + SOPS into .env
   • Ansible provision service enabled (will run after boot)
  ------------------------------------------------------------
